<style>
  :root{
    --mint:#dff0e3;          /* 页面底 */
    --side:#e9f5ec;          /* 侧栏底 */
    --card:#f7fbf8;          /* 卡片底 */
    --line:#c3ddca;          /* 分隔线 */
    --ink:#22694a;           /* 正文/图标 */
    --ink-soft:#5f8f78;      /* 次要文字 */
    --active:#bfe0cb;        /* 选中底色 */
    --active-line:#6ea88a;   /* 选中描边 */
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;
    background:var(--mint);color:var(--ink);
    font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    align-items:flex-start;              /* 兜底：不依赖 stretch */
  }
  a{color:inherit;text-decoration:none}

  /* ---------------- 侧栏 ---------------- */
  aside{
    width:280px;flex:none;min-height:100vh;
    padding:38px 26px 26px;background:var(--side);border-right:1px solid var(--line);
  }
  .avatar{
    display:block;width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 26%;
    border:3px solid #fff;box-shadow:0 4px 14px rgba(34,105,74,.22);background:var(--mint);
  }
  .name{margin:16px 0 4px;font-size:22px;font-weight:700;letter-spacing:.01em}
  .tag{margin:0;font-size:12px;color:var(--ink-soft);line-height:18px}
  .tag::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;
               border-radius:50%;background:#79b894}

  /* 导航：按钮切换，激活态由脚本加 .on 控制 */
  nav{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
  nav button{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:11px 16px;margin-bottom:10px;border-radius:999px;border:1px solid transparent;
    background:none;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);
    cursor:pointer;transition:.18s;
  }
  nav button:hover{background:rgba(255,255,255,.7)}
  nav button svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
                 stroke-linecap:round;stroke-linejoin:round}
  nav button.on{background:var(--active);border-color:var(--active-line);
                box-shadow:0 2px 10px rgba(34,105,74,.14)}
  nav button:focus-visible{outline:2px solid var(--active-line);outline-offset:3px}

  .social{margin-top:60px;padding-top:22px;border-top:1px solid var(--line)}
  .social a{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;transition:.18s}
  .social a:hover{background:var(--active)}
  .social svg{width:22px;height:22px;fill:currentColor}
  .place{margin:0 0 12px;font-size:12px;color:var(--ink-soft)}

  /* ---------------- 主区 ---------------- */
  main{flex:1;min-width:0;padding:34px 40px 40px}

  /* 两张卡片一次只显示一张：由脚本给激活的那张加 .on */
  .panel{
    display:none;background:var(--card);border:1px solid #e2efe6;border-radius:22px;
    box-shadow:0 10px 30px rgba(34,105,74,.07);
    padding:26px 28px;
  }
  .panel.on{display:block}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
        padding-bottom:16px;border-bottom:1px solid #e6f1e9}
  h2{margin:0;font-size:17px;font-weight:700;scroll-margin-top:24px}
  .hint{margin:0;font-size:12.5px;color:var(--ink-soft)}

  .grid{
    display:grid;gap:16px;margin-top:22px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    max-width:960px;
  }
  .item{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border:1px solid #e4efe7;border-radius:16px;background:#fff;
    transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .item:hover{
    transform:translateY(-3px);border-color:var(--active-line);
    box-shadow:0 12px 26px rgba(34,105,74,.16);
  }
  .ico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--mint)}
  .ico svg{width:24px;height:24px}
  .meta{min-width:0}
  .meta b{display:block;font-size:14.5px;font-weight:600}
  .meta span{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty{
    margin-top:22px;padding:44px 20px;text-align:center;border:1px dashed #cfe4d6;
    border-radius:16px;color:var(--ink-soft);font-size:13.5px;background:#fff;
  }

  /* ---------------- 小游戏：翻瓶子 ---------------- */
  .panel.on[data-panel="game"]{display:flex;flex-direction:column}
  .game{flex:1;display:flex;flex-direction:column;gap:12px;margin-top:16px;min-height:0}
  .game-hud{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--side);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  }
  .g-money{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .g-money small{font-size:11px;font-weight:600;color:var(--ink-soft);margin-left:2px}
  .g-bar{flex:1;min-width:140px}
  .g-track{height:10px;border-radius:999px;background:#cfe4d6;overflow:hidden}
  .g-fill{height:100%;width:0;border-radius:999px;
          background:linear-gradient(90deg,#4fae7c,#8fd6a9);transition:width .35s}
  .g-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:3px}
  .g-used{font-size:11.5px;color:var(--ink-soft)}
  .g-used b{color:var(--ink)}

  .g-wrap{flex:1;display:flex;gap:12px;min-height:0}
  .g-board{
    position:relative;flex:1;min-height:340px;border-radius:12px;overflow:hidden;
    border:5px solid #3a2418;
    box-shadow:0 14px 30px rgba(40,25,12,.3),inset 0 0 50px rgba(120,80,30,.16);
    background:repeating-linear-gradient(0deg,#f2d6a4 0 37px,#e6c286 37px 38px),#f2d6a4;
  }
  #gCv{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
  .g-toast{
    position:absolute;left:50%;top:14%;transform:translate(-50%,-8px);
    font-size:26px;font-weight:900;opacity:0;pointer-events:none;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.3);transition:opacity .18s,transform .18s;
    font-variant-numeric:tabular-nums;
  }
  .g-toast.show{opacity:1;transform:translate(-50%,0)}
  .g-toast.up{color:#8ef0b4}
  .g-toast.down{color:#ffd166}

  .g-shop{
    width:180px;flex:none;display:flex;flex-direction:column;gap:10px;
    background:#cfc3a0;border:2px solid #3a2418;border-radius:12px;padding:10px;color:#2f2417;
    box-shadow:0 8px 18px rgba(40,25,12,.25);
  }
  .g-shop h4{margin:0;font-size:11px;letter-spacing:.08em;opacity:.7}
  .g-item{display:flex;align-items:center;gap:8px;background:#e6dcc0;
          border:2px solid #3a2418;border-radius:8px;padding:8px}
  .g-item svg{width:22px;height:38px;flex:none}
  .g-item b{display:block;font-size:12px;line-height:1.3}
  .g-item span{font-size:10.5px;opacity:.75}
  .g-buy{
    border:2px solid #3a2418;border-radius:8px;background:#f4e9c8;
    font:inherit;font-weight:800;font-size:13px;padding:9px;cursor:pointer;transition:.15s;
  }
  .g-buy:hover:not(:disabled){background:#fff5da;transform:translateY(-1px)}
  .g-buy:disabled{opacity:.45;cursor:not-allowed}
  .g-tip{margin:0;font-size:10.5px;line-height:1.6;opacity:.7;overflow-wrap:break-word}

  .g-over{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(46,28,14,.82);color:#ffe9c2;padding:20px;
  }
  .g-over.on{display:grid}
  .g-over h3{margin:0 0 6px;font-size:22px}
  .g-over p{margin:0 0 14px;font-size:13px;opacity:.85}
  .g-over button{
    border:2px solid #ffe9c2;background:transparent;color:#ffe9c2;font:inherit;
    font-weight:800;font-size:14px;padding:9px 20px;border-radius:999px;cursor:pointer;
  }
  .g-over button:hover{background:#ffe9c2;color:#3a2418}

  @media (max-width:760px){
    body{display:block}
    aside{width:auto;min-height:0;padding:24px 20px;border-right:0;border-bottom:1px solid var(--line)}
    nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;padding-top:20px}
    nav a{justify-content:center;padding:10px 12px;margin-bottom:0}
    .social{margin-top:22px;padding-top:18px;display:flex;align-items:center;gap:10px}
    .place{margin:0 10px 0 0}
    main{padding:20px}
    .panel{padding:20px}
  }
  @media (prefers-reduced-motion:reduce){
    .item,.social a{transition:none}
    .item:hover{transform:none}
  }
  @media (max-width:700px){
    .g-wrap{flex-direction:column}
    .g-shop{width:auto}
    .g-item{display:inline-flex;margin-right:8px}
  }
</style>
</head>

        <div class="g-wrap">
          <div class="g-board" id="gBoard">

            <div class="g-toast" id="gToast"></div>

              <div>
                <h3 id="gOvTitle">瓶子用完了</h3>

            <h4>商店</h4>

              <svg viewBox="0 0 26 44"><g fill="#cfe3f2" stroke="#5d7f96" stroke-width="1.4">
                <rect x="3" y="14" width="20" height="28" rx="5"/>
                <rect x="9" y="4" width="8" height="11" rx="2"/>
                <rect x="8" y="0" width="10" height="5" rx="1.5" fill="#8fa9bd"/></g></svg>
              <div><b>经典瓶</b><span><b id="gStock">1</b>/30 · $20</span></div>
            </div>
            <button class="g-buy" id="gBuy">买一瓶 $20</button>

  <!-- 切换逻辑：只有 8 行，不用任何 CSS 选择器技巧，任何浏览器/预览器都能用 -->

    document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
      document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
      document.querySelectorAll(".panel").forEach(p =>
        p.classList.toggle("on", p.dataset.panel === b.dataset.tab));
    });

  <!-- 小游戏：翻瓶子。抛正 +100，抛倒 +300；30 瓶内攒到 5000 通关 -->
  <script>
  (() => {
    const GOAL = 5000, PRICE = 20, MAX_BOTTLES = 30;
    const UPRIGHT = 100, INVERTED = 300;
    const cv = document.getElementById('gCv'), ctx = cv.getContext('2d');
    const board = document.getElementById('gBoard'), $ = id => document.getElementById(id);
    const toast = $('gToast'), over = $('gOver');

    const G = { money:0, used:0, bottles:1, x:0, y:0, rot:0, settle:0,
                spinning:false, ended:false, t:0, dur:0, phase:'idle',
                jumps:0, from:0, to:0, peak:0, fromX:0, toX:0 };

    let W = 0, H = 0;
    function resize() {
      const r = board.getBoundingClientRect();
      if (!r.width) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (G.phase === 'idle') { G.x = W * 0.5; G.y = H * 0.76; }
      draw();
    }

    function drawBottle(cx, cy, rot, squeeze) {
      const S = 1.1, bw = 30 * S, bh = 88 * S;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.scale(squeeze, 1);
      ctx.translate(0, -bh / 2);

      const bodyW = bw, bodyH = bh * 0.66, neckW = bw * 0.36, neckH = bh * 0.2, capH = bh * 0.06;

      ctx.beginPath();
      ctx.roundRect(-bodyW / 2, neckH + capH, bodyW, bodyH, bodyW * 0.28);
      const g = ctx.createLinearGradient(-bodyW / 2, 0, bodyW / 2, 0);
      g.addColorStop(0, '#a9c6db'); g.addColorStop(.35, '#e8f5ff');
      g.addColorStop(.65, '#d5e9f7'); g.addColorStop(1, '#93b3c9');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#5d7f96'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(-neckW / 2, capH, neckW, neckH + 6, neckW * 0.3);
      ctx.fillStyle = '#dcf0fc'; ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(-neckW * 0.62, 0, neckW * 1.24, capH, capH * 0.5);
      ctx.fillStyle = '#7f9cb0'; ctx.fill();
      ctx.strokeStyle = '#4d6a7e'; ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(-bodyW * 0.30, neckH + capH + bodyH * 0.18, bodyW * 0.16, bodyH * 0.5, bodyW * 0.08);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
      ctx.restore();
    }

    function drawShadow(alpha) {
      ctx.save();
      ctx.translate(G.x, H * 0.84);
      ctx.scale(1, 0.42);
      ctx.beginPath(); ctx.arc(0, 0, 23, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(90,60,25,' + alpha + ')'; ctx.fill();
      ctx.restore();
    }

    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      const vg = ctx.createLinearGradient(0, 0, 0, H);
      vg.addColorStop(0, 'rgba(120,80,30,.10)');
      vg.addColorStop(.45, 'rgba(120,80,30,0)');
      vg.addColorStop(1, 'rgba(120,80,30,.16)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

      drawShadow(G.spinning ? 0.10 : 0.22);

      const rot = G.phase === 'air' ? G.rot : G.settle;
      const squeeze = G.phase === 'air'
        ? Math.max(0.22, Math.abs(Math.cos(G.rot * 2))) : 1;
      drawBottle(G.x, G.y, rot, squeeze);

      if (G.phase === 'idle' && !G.ended) {
        ctx.font = '600 13px system-ui,sans-serif';
        ctx.fillStyle = 'rgba(80,52,22,.55)';
        ctx.textAlign = 'center';
        ctx.fillText('点一下抛出瓶子', G.x, H * 0.92);
      }
    }

    function flip() {
      if (G.spinning || G.ended) return;
      if (G.bottles <= 0) { showToast('没瓶子了，去商店买', 'down'); return; }
      G.bottles--; G.used++;
      G.spinning = true; G.phase = 'air'; G.t = 0; G.dur = 1.15;
      G.jumps = 2 + Math.floor(Math.random() * 2);
      G.to = G.jumps * Math.PI * 2;
      G.fromX = G.x;
      G.toX = W * 0.5 + (Math.random() * 2 - 1) * Math.min(110, W * 0.16);
      G.peak = Math.min(210, H * 0.4);
      G.settle = 0;
      updateHud();
    }

    function land() {
      const upright = G.jumps % 2 === 0;
      const gain = upright ? UPRIGHT : INVERTED;
      G.money += gain;
      G.settle = upright ? 0 : Math.PI;
      G.phase = 'land'; G.spinning = false;
      showToast('+$' + gain, upright ? 'up' : 'down');
      if (G.money >= GOAL) finish('🎉 通关了！', '攒到 $' + G.money + '，任务完成。');
      else if (G.used >= MAX_BOTTLES && G.money < PRICE)
        finish('30 瓶用完了', '钱不够再买一瓶（还差 $' + (PRICE - G.money) + '）。');
      updateHud();
    }

    function finish(title, text) {
      G.ended = true;
      $('gOvTitle').textContent = title;
      $('gOvText').textContent = text;
      over.classList.add('on');
    }

    let toastTimer = 0;
    function showToast(txt, cls) {
      toast.textContent = txt;
      toast.className = 'g-toast show ' + cls;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.className = 'g-toast ' + cls, 620);
    }

    function updateHud() {
      $('gMoney').textContent = G.money;
      $('gUsed').textContent = G.used;
      $('gStock').textContent = G.bottles;
      const pct = Math.min(100, G.money / GOAL * 100);
      $('gFill').style.width = pct.toFixed(2) + '%';
      $('gPct').textContent = pct.toFixed(1) + '%';
      const buy = $('gBuy');
      buy.disabled = G.used >= MAX_BOTTLES || G.money < PRICE;
      buy.textContent = G.used >= MAX_BOTTLES ? '已买满' : '买一瓶 $' + PRICE;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (G.spinning) {
        G.t += dt;
        const p = Math.min(1, G.t / G.dur);
        const arc = Math.sin(p * Math.PI);
        G.x = G.fromX + (G.toX - G.fromX) * p;
        G.y = H * 0.76 - G.peak * arc;
        G.rot = G.to * (0.5 - 0.5 * Math.cos(p * Math.PI));
        if (p >= 1) land();
      }
      draw();
      requestAnimationFrame(loop);
    }

    board.addEventListener('click', e => { if (!e.target.closest('.g-over')) flip(); });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ') {
        if (document.querySelector('.panel[data-panel="game"]').classList.contains('on')) {
          e.preventDefault(); flip();
        }
      }
    });
    $('gBuy').onclick = () => {
      if (G.used >= MAX_BOTTLES || G.money < PRICE) return;
      G.money -= PRICE; G.bottles++;
      updateHud();
    };
    $('gAgain').onclick = () => {
      G.money = 0; G.used = 0; G.bottles = 1;
      G.ended = false; G.phase = 'idle'; G.spinning = false;
      G.x = W * 0.5; G.y = H * 0.76; G.settle = 0;
      over.classList.remove('on'); updateHud();
    };

    new ResizeObserver(resize).observe(board);
    window.addEventListener('resize', resize);
    resize(); updateHud(); requestAnimationFrame(loop);
  })();
  </script>
</body>
