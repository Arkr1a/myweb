<title>我的链接</title>
<style>
  :root{
    --navy:#0A2B4E;          /* 主色 */
    --navy-deep:#061B33;
    --blue:#3B82F6;          /* 点缀色 */
    --blue-light:#60A5FA;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;
  }
  /* 深蓝底 + 三层蓝色光晕（南孚风光晕背景，纯 CSS） */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(58% 42% at 50% 34%,rgba(59,130,246,.30),transparent 70%),
      radial-gradient(70% 55% at 12% 8%,rgba(96,165,250,.16),transparent 65%),
      radial-gradient(70% 55% at 90% 92%,rgba(59,130,246,.18),transparent 65%),
      linear-gradient(160deg,#081f3a,var(--navy-deep) 55%,#04121f);
  }
  main{display:grid;justify-items:center;gap:clamp(28px,7vw,46px);padding:24px}

  /* 头像位：旋转光环 + 纯 CSS 鲸鱼标志 */
  .avatar{position:relative;width:clamp(132px,30vw,180px);aspect-ratio:1}
  .avatar::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,var(--blue),var(--blue-light),transparent 55%,var(--blue));
    animation:spin 6s linear infinite;
  }
  .avatar::after{
    content:"";position:absolute;inset:4px;border-radius:50%;
    background:var(--navy-deep);box-shadow:0 0 30px rgba(59,130,246,.6);
  }
  .avatar svg{
    position:absolute;inset:9px;width:calc(100% - 18px);height:calc(100% - 18px);
    padding:22%;z-index:1;
    filter:drop-shadow(0 4px 14px rgba(59,130,246,.55));
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 圆形图标按钮 */
  nav{display:flex;gap:clamp(22px,5vw,30px)}
  nav a{
    width:clamp(60px,15vw,72px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
    background:rgba(255,255,255,.96);
    box-shadow:0 8px 22px rgba(6,27,51,.5);
    transition:transform .22s,box-shadow .22s;
  }
  nav a:hover,nav a:focus-visible{
    transform:translateY(-5px) scale(1.04);
    box-shadow:0 14px 30px rgba(59,130,246,.75);
  }
  nav a:focus-visible{outline:2px solid var(--blue-light);outline-offset:4px}
  nav svg{width:52%;height:52%}

  @media (prefers-reduced-motion:reduce){
    .avatar::before{animation:none}
    nav a{transition:none}
  }
</style>
</head>
