<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkr1a · 无限进步</title>
<link rel="icon" href="assets/avatar.jpg">
<style>
  :root{
    --mint:#dff0e3;          /* 页面底 */
    --side:#e9f5ec;          /* 侧栏底 */
    --card:#f7fbf8;          /* 卡片底 */
    --line:#c3ddca;          /* 分隔线 */
    --ink:#22694a;           /* 正文/图标 */
    --ink-soft:#5f8f78;      /* 次要文字 */
    --active:#bfe0cb;        /* 选中底色 */
    --active-line:#6ea88a;   /* 选中描边 */
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;
    background:var(--mint);color:var(--ink);
    font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  a{color:inherit;text-decoration:none}

  /* ---------------- 侧栏 ---------------- */
  aside{
    width:280px;flex:none;min-height:100vh;display:flex;flex-direction:column;
    padding:38px 26px 26px;background:var(--side);border-right:1px solid var(--line);
  }
  .avatar{
    width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 26%;
    border:3px solid #fff;box-shadow:0 4px 14px rgba(34,105,74,.22);
  }
  .name{margin:16px 0 4px;font-size:22px;font-weight:700;letter-spacing:.01em}
  .tag{margin:0;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#79b894}

  /* 纯 CSS 单选切换 */
  .tabs input{position:absolute;opacity:0;pointer-events:none}
  nav{display:grid;gap:10px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
  nav label{
    display:flex;align-items:center;gap:12px;
    padding:11px 16px;border-radius:999px;border:1px solid transparent;
    font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.18s;
  }
  nav label:hover{background:rgba(255,255,255,.7)}
  nav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round}
  #tab-web:checked ~ nav label[for="tab-web"],
  #tab-game:checked ~ nav label[for="tab-game"]{
    background:var(--active);border-color:var(--active-line);
    box-shadow:0 2px 10px rgba(34,105,74,.14);
  }
  #tab-web:focus-visible ~ nav label[for="tab-web"],
  #tab-game:focus-visible ~ nav label[for="tab-game"]{outline:2px solid var(--active-line);outline-offset:3px}

  .social{margin-top:auto;padding-top:22px;border-top:1px solid var(--line)}
  .social a{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;transition:.18s}
  .social a:hover{background:var(--active)}
  .social svg{width:22px;height:22px;fill:currentColor}
  .place{margin:0 0 12px;font-size:12px;color:var(--ink-soft)}

  /* ---------------- 主区 ---------------- */
  main{flex:1;min-width:0;padding:34px 40px 40px;display:flex}
  .panel{
    flex:1;background:var(--card);border:1px solid #e2efe6;border-radius:22px;
    box-shadow:0 10px 30px rgba(34,105,74,.07);
    padding:26px 28px;display:none;min-height:460px;
  }
  #tab-web:checked  ~ main .panel-web,
  #tab-game:checked ~ main .panel-game{display:flex;flex-direction:column}

  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
        padding-bottom:16px;border-bottom:1px solid #e6f1e9}
  h2{margin:0;font-size:17px;font-weight:700}
  .hint{margin:0;font-size:12.5px;color:var(--ink-soft)}

  .grid{
    display:grid;gap:16px;margin-top:22px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    max-width:960px;                     /* 超宽屏最多三列，卡片不拉伸 */
  }
  .item{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border:1px solid #e4efe7;border-radius:16px;background:#fff;
    transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .item:hover{
    transform:translateY(-3px);border-color:var(--active-line);
    box-shadow:0 12px 26px rgba(34,105,74,.16);
  }
  .ico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--mint)}
  .ico svg{width:24px;height:24px}
  .meta{min-width:0}
  .meta b{display:block;font-size:14.5px;font-weight:600}
  .meta span{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty{
    margin-top:22px;padding:44px 20px;text-align:center;border:1px dashed #cfe4d6;
    border-radius:16px;color:var(--ink-soft);font-size:13.5px;background:#fff;
  }

  @media (max-width:760px){
    body{flex-direction:column}
    aside{width:auto;min-height:0;padding:24px 20px;border-right:0;border-bottom:1px solid var(--line)}
    nav{grid-template-columns:1fr 1fr;margin-top:22px;padding-top:20px}
    nav label{justify-content:center;padding:10px 12px}
    .social{margin-top:20px;padding-top:18px;display:flex;align-items:center;gap:10px}
    .place{margin:0 10px 0 0}
    main{padding:20px}
    .panel{padding:20px;min-height:0}
  }
  @media (prefers-reduced-motion:reduce){
    .item,.social a{transition:none}
    .item:hover{transform:none}
  }
</style>
</head>
